<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ennen kuin kysyt Elinalta</title>
<meta name="description" content="Sarkastinen markkinointitoimiston selviytymispeli: 40 kysymystä ennen kuin häiritset Elinaa.">
<meta name="theme-color" content="#FFF8EC">
<meta name="color-scheme" content="light only">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8EC; --surface:#FFFFFF; --ink:#1D1B22; --muted:#55505E; --shadow:#1D1B22; --dots:rgba(29,27,34,.07);
  --q:#FFE066; --detour:#BFE3FF; --stop:#FFC2B8; --self:#DCCBFF; --go:#BDF2C5;
  --accent:#B8312A; --s-stop:#B8312A; --s-self:#5B3CC4; --s-go:#1D7337;
  --meter-bg:#EFE6D6; --skin:#FFD3A6; --hair:#3B2A20; --cup:#E8453C; --cta:#FF8A3D; --cta-hover:#FF9D5C;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --head:'Fredoka','Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --gutter:max(16px,env(safe-area-inset-left));
  --gutter-r:max(16px,env(safe-area-inset-right));
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--dots) 1.5px,transparent 1.5px);background-size:22px 22px;
  color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;overflow-wrap:break-word}
h1,h2,h3,h4,p,dd,li,.bubble,.ans,.pill{hyphens:auto;-webkit-hyphens:auto}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:680px;margin:0 auto;padding-left:var(--gutter);padding-right:var(--gutter-r)}
[hidden]{display:none!important}

/* ---------- header (collapses to one line during a game) ---------- */
header{padding-top:max(18px,env(safe-area-inset-top));padding-bottom:10px;transition:padding .3s ease}
.kick{font-family:var(--head);font-weight:600;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0}
h1{font-family:var(--head);font-weight:700;font-size:clamp(1.7rem,7.6vw,2.8rem);line-height:1.08;margin:4px 0 8px;transition:font-size .3s ease,margin .3s ease}
.subtitle{margin:0;color:var(--muted);font-size:1rem}
body.in-game header{padding-top:max(8px,env(safe-area-inset-top));padding-bottom:6px}
body.in-game .kick,body.in-game .subtitle{display:none}
body.in-game h1{font-size:1.02rem;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;hyphens:none}

main{padding-top:12px;padding-bottom:24px}

/* ---------- HUD ---------- */
.hud{display:flex;gap:12px;align-items:flex-end;margin:4px 0 10px}
.avatar{flex:none;width:76px;text-align:center}
.face{width:76px;height:76px;display:block;overflow:visible}
.avatar-tag{display:inline-block;max-width:100%;margin-top:-4px;font-family:var(--head);font-weight:600;font-size:.72rem;background:var(--surface);border:2px solid var(--ink);border-radius:12px;padding:1px 6px;line-height:1.25}
.bubble{position:relative;flex:1;min-width:0;min-height:60px;margin-bottom:18px;background:var(--surface);border:3px solid var(--ink);border-radius:16px;padding:8px 12px;box-shadow:4px 4px 0 var(--shadow);font-size:.98rem;line-height:1.35}
.bubble::before{content:"";position:absolute;left:-12px;bottom:16px;width:18px;height:18px;background:var(--surface);border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
.bubble b{display:block}
.bubble .think{display:block;margin-top:4px;color:var(--muted);font-style:italic;font-size:.92rem}
.bubble.pop{animation:pop .3s ease-out}

.meter{display:grid;gap:4px;font-size:.92rem}
.meter-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 8px}
.meter-top b{font-family:var(--head);font-weight:600;white-space:nowrap}
.m-delta{font-family:var(--head);font-weight:700;opacity:0;transition:opacity .3s;margin-left:6px}
.m-delta.show{opacity:1} .m-delta.neg{color:var(--s-stop)} .m-delta.pos{color:var(--s-go)}
.bar{height:14px;border:3px solid var(--ink);border-radius:999px;background:var(--meter-bg);overflow:hidden}
.bar i{display:block;height:100%;width:100%;transition:width .5s ease,background-color .5s ease}
.prog{height:6px;border-radius:99px;background:var(--meter-bg);margin:10px 0 14px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ink);transition:width .4s ease}

/* ---------- card ---------- */
.card{position:relative;background:var(--fill,var(--surface));border:3px solid var(--ink);border-radius:18px;padding:18px 16px 16px;box-shadow:5px 5px 0 var(--shadow)}
.card.is-q{--fill:var(--q)}
.t-stop{--fill:var(--stop);--st:var(--s-stop)} .t-detour{--fill:var(--detour)} .t-self{--fill:var(--self);--st:var(--s-self)} .t-go{--fill:var(--go);--st:var(--s-go)}
.kicker{display:block;font-family:var(--head);font-weight:600;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card h2{font-family:var(--head);font-weight:600;font-size:clamp(1.32rem,6vw,1.8rem);line-height:1.2;margin:6px 0 8px}
.card h2:focus{outline:none}
.card p{margin:0 0 8px;font-size:1.04rem}
.sub{color:var(--muted)}
.card.enter{animation:enter .28s ease-out}
.card.shake{animation:shake .45s}
.stamp{display:inline-block;font-family:var(--head);font-weight:700;font-size:1.2rem;letter-spacing:.06em;text-transform:uppercase;color:var(--st);
  border:4px solid currentColor;border-radius:10px;padding:0 12px;transform:rotate(-7deg);animation:slam .5s cubic-bezier(.2,1.5,.4,1) both;margin:2px 0 6px}
.status-h{font-family:var(--head);font-weight:600;font-size:.95rem;margin:18px 0 0;color:var(--muted)}
.status{margin:6px 0 4px;display:grid;gap:4px;font-size:.96rem}
.status div{display:flex;justify-content:space-between;gap:12px;border-bottom:2px dashed color-mix(in srgb,var(--ink) 25%,transparent);padding:4px 0}
.status dt{color:var(--muted)} .status dd{margin:0;font-weight:700;text-align:right}

.answers{display:grid;gap:10px;margin-top:14px}
.ans{width:100%;min-height:54px;display:flex;align-items:center;gap:12px;text-align:left;padding:10px 14px;background:var(--surface);color:var(--ink);
  border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--shadow);font-weight:700;font-size:1.03rem;line-height:1.25;cursor:pointer;
  transition:transform .08s,box-shadow .08s}
.ans:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
@media (hover:hover){.ans:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--shadow)}}
.ans .k{flex:none;width:28px;height:28px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--head);font-size:.85rem}
.ans.primary{background:var(--cta);color:var(--ink);justify-content:center;text-align:center;font-family:var(--head);font-weight:600;font-size:1.15rem}
.ans.primary .k{display:none}
@media (hover:hover){.ans.primary:hover{background:var(--cta-hover)}}
.mode{flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.mode.primary{align-items:center;text-align:center}
.mode .mt{font-family:var(--head);font-weight:600;font-size:1.18rem}
.mode .mm{font-family:var(--body);font-weight:400;font-size:.9rem;opacity:.85}
.verdict{margin-top:6px}
.cert{margin-top:14px;background:var(--surface);border:3px dashed var(--ink);border-radius:16px;padding:12px 14px}
.cert .rank{font-size:1.05rem;margin:4px 0 2px}
.cert .rank b{font-family:var(--head);font-weight:700;font-size:1.25rem;color:var(--accent)}
.cert h3{font-family:var(--head);font-weight:600;font-size:1rem;margin:12px 0 6px}
.ach{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ach li{display:grid;grid-template-columns:28px 1fr;gap:2px 8px;align-items:start}
.ach li::before{content:"★";grid-row:span 2;width:28px;height:28px;border-radius:50%;background:var(--q);border:2px solid var(--ink);display:grid;place-items:center;font-size:.85rem;color:var(--ink)}
.ach span{color:var(--muted);font-size:.95rem}

.skip-zone{position:relative;height:56px;margin:14px 0 2px}
#skip{position:absolute;left:50%;top:8px;transform:translateX(-50%);max-width:100%;min-height:40px;padding:6px 14px;border:2.5px dashed var(--muted);border-radius:999px;background:transparent;
  color:var(--muted);font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:left .22s ease,top .22s ease}
#skip.done{border-style:solid}
#skip.wiggle{animation:shake .4s}
.under{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 16px;margin-top:10px}
details.path summary{cursor:pointer;font-family:var(--head);font-weight:600;color:var(--muted);min-height:44px;display:flex;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:6px}
.chip{font-size:.88rem;background:var(--surface);border:2px solid var(--ink);border-radius:999px;padding:2px 10px}
.linkbtn{display:inline-flex;align-items:center;min-height:44px;padding:0;background:none;border:0;color:var(--accent);font-weight:700;font-size:.95rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-align:left}

footer{padding-top:6px;padding-bottom:max(36px,env(safe-area-inset-bottom));color:var(--muted);font-size:.9rem;text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
#confetti i{position:absolute;top:-24px;border-radius:2px;animation:fall linear forwards}
#toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,20px);width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- avatar parts (fixed colours so the face works in both themes) ---------- */
.face .disc{fill:#CFE8FF;stroke:var(--ink);stroke-width:3}
.face .ln{stroke:#1D1B22;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.face .head{fill:var(--skin)} .face .hair{fill:var(--hair)}
.face .brow{fill:none;stroke-width:3.5;transform-box:fill-box;transform-origin:center;transition:transform .3s}
.face .eyes circle{fill:#1D1B22}
.face .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.face .mouth{fill:none;stroke-width:3.5}
.face .glasses circle{fill:rgba(255,255,255,.28);stroke-width:2.5}
.face .band{fill:none;stroke-width:5}
.face .cup{fill:var(--cup);stroke-width:2.5}
.face .earring{fill:#FFD43B;stroke-width:2}
.face .blush ellipse{fill:#FF8FA3;opacity:.65}
.face .sweat{fill:#7CC4FF;stroke-width:2}
.face .steam path{fill:none;stroke:var(--muted);stroke-width:3;stroke-linecap:round;animation:steam 1.1s ease-in-out infinite alternate}
.face .eyes-love path{fill:#E8453C;stroke-width:1.5}
.face .eyes-x,.face .eyes-love,.face .sweat,.face .steam,.face .blush{display:none}
.face.m-happy .blush,.face.m-love .blush{display:inline}
.face.m-annoyed .sweat,.face.m-fried .sweat{display:inline}
.face.m-fried .steam{display:inline}
.face.m-fried .eyes,.face.m-love .eyes{display:none}
.face.m-fried .eyes-x,.face.m-love .eyes-love{display:inline}
.face.m-happy .brow,.face.m-love .brow{transform:translateY(-3px)}
.face.m-meh .brow{transform:translateY(3px)}
.face.m-annoyed .brow-l{transform:translateY(2px) rotate(16deg)} .face.m-annoyed .brow-r{transform:translateY(2px) rotate(-16deg)}
.face.m-fried .brow-l{transform:rotate(-14deg)} .face.m-fried .brow-r{transform:rotate(14deg)}
.face.bump{animation:bump .35s ease-out} .face.shake{animation:shake .45s}

@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes bump{0%{transform:translateY(0)}40%{transform:translateY(-8px)}100%{transform:translateY(0)}}
@keyframes slam{0%{transform:scale(2.4) rotate(-7deg);opacity:0}100%{transform:scale(1) rotate(-7deg);opacity:1}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes steam{from{transform:translateY(0);opacity:.4}to{transform:translateY(-5px);opacity:1}}
@keyframes fall{to{transform:translateY(112vh) rotate(760deg)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* very small phones */
@media (max-width:359px){
  body{font-size:16px}
  .avatar,.face{width:64px} .face{height:64px}
  .tab{padding:6px 12px}
  .card{padding:16px 13px 14px}
  .ans{padding:9px 11px;gap:9px}
  .status div{flex-direction:column;gap:0} .status dd{text-align:left}
}
/* tablets and up */
@media (min-width:600px){
  body{font-size:18.5px}
  header{padding-top:max(32px,env(safe-area-inset-top))}
  .avatar,.face{width:104px} .face{height:104px}
  .avatar-tag{font-size:.78rem}
  .bubble{font-size:1.04rem;padding:10px 14px;min-height:70px}
  .answers.multi{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .card{padding:24px 24px 22px}
  .meter{font-size:.98rem} .bar{height:18px}
}
/* short phones: tighten everything so the answers fit on screen */
@media (max-height:700px) and (orientation:portrait){
  .avatar,.face{width:58px} .face{height:58px}
  .avatar-tag{display:none}
  .hud{margin:0 0 8px;gap:12px}
  .bubble{min-height:0;margin-bottom:6px;padding:7px 10px;font-size:.93rem}
  .bubble::before{bottom:12px}
  .bubble .think{font-size:.86rem;margin-top:2px}
  .meter{font-size:.86rem;gap:2px} .bar{height:10px;border-width:2.5px}
  .prog{margin:8px 0 10px}
  .card{padding:14px 13px 13px;border-radius:16px}
  .card h2{font-size:1.24rem;margin:4px 0 6px}
  .card p{font-size:.98rem;margin-bottom:6px}
  .kicker{font-size:.74rem}
  .answers{gap:8px;margin-top:10px}
  .ans{min-height:48px;padding:8px 12px;font-size:.98rem;box-shadow:3px 3px 0 var(--shadow)}
  .ans .k{width:24px;height:24px;font-size:.78rem}
  .stamp{font-size:1.05rem}
  .skip-zone{margin-top:10px}
}
/* landscape phones: two columns, no header during the game */
@media (max-height:500px) and (orientation:landscape){
  body.in-game header{display:none}
  #play{display:grid;grid-template-columns:minmax(210px,36%) minmax(0,1fr);column-gap:18px;align-items:start}
  #play .hud{grid-column:1;grid-row:1;margin-bottom:6px}
  #play .meter{grid-column:1;grid-row:2}
  #play .prog{grid-column:1;grid-row:3;margin:8px 0 0}
  #play .card{grid-column:2;grid-row:1 / span 4}
  #play .skip-zone{grid-column:2;grid-row:5}
  #play .under{grid-column:1 / -1;grid-row:6}
  .avatar,.face{width:58px} .face{height:58px}
  .avatar-tag{display:none}
  .bubble{min-height:0;margin-bottom:6px;font-size:.92rem;padding:7px 10px}
  .bubble .think{font-size:.86rem}
  .card{padding:14px 14px 13px}
  .card h2{font-size:1.25rem;margin:4px 0 6px}
  .card p{font-size:.98rem}
  .answers{gap:8px;margin-top:10px}
  .answers.multi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .ans{min-height:48px;padding:8px 12px;font-size:.96rem}
  main{padding-top:8px}
}

</style>
</head>
<body>
<header class="wrap">
  <p class="kick" id="kick"></p>
  <h1 id="h1"></h1>
  <p class="subtitle" id="subtitle"></p>
</header>
<main class="wrap">
  <section id="play">
    <div class="hud" id="hud">
      <div class="avatar" id="avatar"></div>
      <div class="bubble" id="bubble" aria-live="polite"></div>
    </div>
    <div class="meter">
      <div class="meter-top"><span id="m-label"></span><span><b id="m-val"></b><span class="m-delta" id="m-delta"></span></span></div>
      <div class="bar" aria-hidden="true"><i id="m-fill"></i></div>
    </div>
    <div class="prog" aria-hidden="true"><i id="prog"></i></div>
    <article class="card" id="card"></article>
    <div class="skip-zone" id="skip-zone" hidden><button type="button" id="skip"></button></div>
    <div class="under">
      <details class="path" id="path" hidden><summary id="path-sum"></summary><div class="chips" id="chips"></div></details>
      <button class="linkbtn" id="quit" type="button" hidden></button>
    </div>
  </section>
</main>
<footer class="wrap" id="footer"></footer>
<div id="confetti" aria-hidden="true"></div>
<div id="toast" role="status"></div>

<script>
const seen = (S, id) => S.visited.includes(id);
const NEXT = '@next', RETRY = '@retry';

const UI = {
  kicker: 'Elina, markkinointi (ei taikuri)',
  title: 'Ennen kuin kysyt Elinalta',
  subtitle: 'Interaktiivinen selviytymisopas kaikille, joilla on ”ihan pikainen markkinointijuttu”.',
  ql: '”', qr: '”',
  avatar: 'elina', avatarTag: 'Elina · ei taikuri', avatarAlt: 'Elinan kasvot, jotka reagoivat valintoihisi',
  hello: 'Ai. Moi. Kestääkö tämä kauan?',
  helloThink: '(Tämä kestää kauan.)',
  startSay: { normal:'No niin. Mennään.', full:'Koko rumba? Oletko varma? No, sinä sen valitsit.' },
  meter: 'Elinan kärsivällisyys',
  moodWords: ['Ilahtunut', 'Ok', 'Meh', 'Ärtynyt', 'Käristynyt'],
  start: 'Alku',
  startTitle: 'Joku markkinointihomma mielessä?',
  startSub: 'Vastaa rehellisesti. Elina huomaa, jos valehtelet. Elina huomaa aina.',
  statusTitle: 'Elinan tilannekatsaus juuri nyt',
  status: [
    ['Elinan tila', 'Kiireinen (vuodesta 2019)'],
    ['Avoimia ”pikaisia juttuja”', '27'],
    ['Palavereja tänään', '9, joista 3 palavereista'],
    ['Nyt kommentoitava versio', 'final_FINAL_v7'],
    ['Kahvin taso', 'Kriittinen']
  ],
  modes: {
    normal: { t:'Normaali kierros', m:n => `${n} kysymystä · n. 3 min · joka kerta eri kysymykset` },
    full:   { t:'Koko rumba', m:n => `Kaikki ${n} kysymystä · n. 10 min · vain vahvoille` }
  },
  question: 'Kysymys',
  quit: 'Lopeta ja palaa alkuun',
  quitToast: 'Luovutit. Elina kirjasi sen.',
  skipLabel: 'Ohita kaikki, anna mun vaan kysyä',
  skip: ['Ei.', 'Liian hidas.', 'Melkein!', 'Elina on nopeampi.', 'Hyvä yritys.', 'Edelleen ei.'],
  skipDone: 'Myös ohitusnappi on kiireinen.',
  skipSay: 'Luulitko oikeasti, että tähän on oikotie? Voi pientä.',
  trail: 'Reittisi tähän asti',
  outcome: 'Lopputulos:',
  badge: { stop:'Ei käy', detour:'Kiertotie', self:'Ratkaisit itse', go:'Saa kysyä' },
  stamps: { stop:'Hylätty', self:'Ratkaistu!', go:'Hyväksytty' },
  verdict: {
    self: 'Paras mahdollinen loppu. Elina ei koskaan edes tiennyt, että sinulla oli kysymys.',
    go:   'Voit nyt lähestyä Elinaa. Rauhallisesti. Sanomatta sanaa ”viraali”.',
    stop: 'Pyyntö hylätty. Tämä oli opettavainen kokemus kaikille osapuolille.'
  },
  certTitle: 'Virallinen keskeytystodistus',
  certRank: 'Arvonimesi',
  certStats: (p, q, d) => `Kärsivällisyyttä jäljellä: ${p} % · Kysymyksiä: ${q} · Kiertoteitä: ${d}`,
  ranks: [
    { min:90, t:'Vuoden työkaveri (ehdokas)' },
    { min:70, t:'Briefin kirjoittaja' },
    { min:50, t:'Hyväksyttävä ihminen' },
    { min:30, t:'Tunnettu keskeyttäjä' },
    { min:0,  t:'Porttikielto kahviautomaatille' }
  ],
  achTitle: 'Avatut saavutukset',

  function faceSVG(kind){
    const elina = kind === 'elina';
    const hairBack = elina ? '<path class="hair ln" d="M22 66 C20 34 40 22 60 22 C82 22 100 36 98 66 L100 104 C92 110 84 106 82 100 L82 76 L38 76 L38 100 C36 106 28 110 20 104 Z"/>' : '';
    const hairTop = elina
      ? '<path class="hair ln" d="M27 60 C27 38 44 28 60 28 C78 28 93 40 93 60 C88 50 78 44 66 42 C58 46 46 46 38 44 C32 48 29 54 27 60 Z"/>'
      : '<path class="hair ln" d="M27 58 C25 36 42 24 60 26 C80 24 96 38 93 58 C88 48 80 44 72 46 C68 40 60 40 54 44 C46 40 36 44 32 50 C30 52 28 55 27 58 Z"/>';
    const extras = elina
      ? '<circle class="earring ln" cx="26" cy="80" r="4.5"/><circle class="earring ln" cx="94" cy="80" r="4.5"/>'
      : '<g class="glasses"><circle class="ln" cx="48" cy="62" r="10"/><circle class="ln" cx="72" cy="62" r="10"/><path class="ln" d="M58 62 h4"/></g>' +
        '<path class="band ln" d="M22 66 A38 38 0 0 1 98 66"/><rect class="cup ln" x="14" y="58" width="12" height="22" rx="5"/><rect class="cup ln" x="94" y="58" width="12" height="22" rx="5"/>';
    return `<svg viewBox="0 0 120 120" class="face" id="face" role="img" aria-label="${UI.avatarAlt}">
      <circle class="disc" cx="60" cy="62" r="56"/>
      <g class="steam"><path d="M42 20 q-4 -5 0 -10 q4 -5 0 -10"/><path d="M60 16 q-4 -5 0 -10 q4 -5 0 -10"/><path d="M78 20 q-4 -5 0 -10 q4 -5 0 -10"/></g>
      ${hairBack}<circle class="head ln" cx="60" cy="66" r="34"/>${hairTop}
      <path class="brow brow-l ln" d="M42 50 h13"/><path class="brow brow-r ln" d="M65 50 h13"/>
      <g class="eyes"><circle cx="48" cy="62" r="4.5"/><circle cx="72" cy="62" r="4.5"/></g>
      <g class="eyes-x"><path class="ln" d="M43 63 h10 M67 63 h10"/></g>
      <g class="eyes-love"><path class="ln" d="M48 68 C40 62 41 56 45 56 C47 56 48 58 48 59 C48 58 49 56 51 56 C55 56 56 62 48 68 Z"/><path class="ln" d="M72 68 C64 62 65 56 69 56 C71 56 72 58 72 59 C72 58 73 56 75 56 C79 56 80 62 72 68 Z"/></g>
      <g class="blush"><ellipse cx="38" cy="76" rx="6" ry="3.5"/><ellipse cx="82" cy="76" rx="6" ry="3.5"/></g>
      <path class="sweat ln" d="M90 40 q6 9 0 12 q-6 -3 0 -12z"/>
      <path class="mouth ln" id="mouth" d="${MOUTH.happy}"/>${extras}</svg>`;
  }
  $('avatar').innerHTML = faceSVG(UI.avatar) + (UI.avatarTag ? `<span class="avatar-tag">${UI.avatarTag}</span>` : '');

  /* ---------- state ---------- */
  const S = {};
  let skipN = 0, lastDodge = 0;
  function reset(){
    Object.assign(S, {cur:'start', mode:'normal', seq:[], qpos:0, lastQ:null, patience:100, trail:[], visited:[], asked:0, detours:0, lost:0, qCount:{}});
    skipN = 0; const sk = $('skip'); sk.textContent = UI.skipLabel; sk.className = ''; sk.style.left = ''; sk.style.top = ''; sk.style.transform = '';
  }
  const level = p => p >= 85 ? 0 : p >= 65 ? 1 : p >= 45 ? 2 : p >= 25 ? 3 : 4;
  const rankOf = p => (UI.ranks.find(r => p >= r.min) || UI.ranks[UI.ranks.length - 1]).t;
  const isTerminal = n => n.type !== 'q' && n.type !== 'start' && !n.opts;

  function buildSeq(mode, force){
    const seq = [];
    STAGES.forEach(st => {
      let qs;
      if (st.fixed) qs = st.qs.slice();
      else if (mode === 'full') qs = shuffle(st.qs);
      else {
        qs = shuffle(st.qs).slice(0, st.pick);
        if (force && st.qs.includes(force) && !qs.includes(force)) qs[0] = force;
      }
      seq.push(...qs);
    });
    return seq;
  }
  function enter(id){
    S.cur = id; S.visited.push(id);
    const n = N[id];
    if (n.type === 'q') S.qCount[id] = (S.qCount[id] || 0) + 1;
    if (n.type === 'detour') S.detours++;
  }
  function goTo(next){
    if (next === '@next'){
      const p = S.qpos + 1;
      if (p < S.seq.length){ S.qpos = p; S.lastQ = S.seq[p]; return enter(S.lastQ); }
      return enter(SPINE_END);
    }
    if (next === '@retry') return enter(S.lastQ);
    if (N[next].type === 'q'){
      let i = S.seq.indexOf(next);
      if (i < 0){ S.seq.splice(S.qpos + 1, 0, next); i = S.qpos + 1; }
      S.qpos = i; S.lastQ = next; return enter(next);
    }
    enter(next);
  }

  function setFace(anim){
    const f = $('face');
    const m = S.cur === 'end_coffee' ? 'love' : MOODS[level(S.patience)];
    f.setAttribute('class', 'face m-' + m);
    $('mouth').setAttribute('d', MOUTH[m]);
    if (anim && !reduce){ f.getBoundingClientRect(); f.classList.add(anim); }
  }
  function say(main, think){
    const b = $('bubble');
    b.innerHTML = (main ? `<b>${main}</b>` : '') + (think ? `<span class="think">${think}</span>` : '');
    b.classList.remove('pop'); void b.offsetWidth; if (!reduce) b.classList.add('pop');
  }
  function meter(delta){
    const p = S.patience;
    $('m-fill').style.width = p + '%';
    $('m-fill').style.backgroundColor = `hsl(${Math.round(p * 1.2)} 72% 47%)`;
    $('m-val').textContent = `${p} % · ${UI.moodWords[level(p)]}`;
    const d = $('m-delta');
    if (delta){
      d.textContent = (delta > 0 ? '+' : '') + delta;
      d.className = 'm-delta show ' + (delta > 0 ? 'pos' : 'neg');
      clearTimeout(meter.t); meter.t = setTimeout(() => d.classList.remove('show'), 1600);
    }
  }
  function achievements(){
    const end = N[S.cur];
    const got = UI.ach.filter(a => { try { return a.test(S, end); } catch(e){ return false; } });
    return (got.length ? got : [UI.achNone]).slice(0, 4);
  }

  /* ---------- rendering ---------- */
  function answersHTML(opts){
    return `<div class="answers${opts.length > 1 ? ' multi' : ''}">` + opts.map((o, i) =>
      `<button class="ans" data-i="${i}"><span class="k" aria-hidden="true">${i + 1}</span><span>${o.label}</span></button>`).join('') + '</div>';
  }
  function endHTML(n){
    const p = S.patience;
    return `<p class="verdict"><b>${UI.outcome}</b> ${UI.verdict[n.type]}</p>
      <div class="cert"><span class="kicker">${UI.certTitle}</span>
        <p class="rank">${UI.certRank}: <b>${rankOf(p)}</b></p>
        <p class="sub">${UI.certStats(p, S.asked, S.detours)}</p>
        <h3>${UI.achTitle}</h3>
        <ul class="ach">${achievements().map(a => `<li><b>${a.t}</b><span>${a.d}</span></li>`).join('')}</ul>
      </div>
      <div class="answers"><button class="ans primary" data-act="again">${UI.playAgain}</button>
        <button class="ans" data-act="copy"><span class="k" aria-hidden="true">↗</span><span>${UI.copy}</span></button></div>`;
  }
  function render(focus){
    const n = N[S.cur], card = $('card');
    document.body.classList.toggle('in-game', S.cur !== 'start');
    let cls = 'card', h;
    if (n.type === 'start'){
      h = `<span class="kicker">${UI.start}</span><h2 tabindex="-1">${UI.startTitle}</h2><p>${UI.startSub}</p>
        <div class="answers">
          <button class="ans primary mode" data-act="start" data-mode="normal"><span class="mt">${UI.modes.normal.t}</span><span class="mm">${UI.modes.normal.m(NORMAL_Q)}</span></button>
          <button class="ans mode" data-act="start" data-mode="full"><span class="mt">${UI.modes.full.t}</span><span class="mm">${UI.modes.full.m(ALL_Q)}</span></button>
        </div>
        <h3 class="status-h">${UI.statusTitle}</h3>
        <dl class="status">${UI.status.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
    } else if (n.type === 'q'){
      cls += ' is-q';
      h = `<span class="kicker">${STAGE_OF[S.cur].name} · ${S.qpos + 1}/${S.seq.length}</span><h2 tabindex="-1">${n.q}</h2><p class="sub">${n.sub}</p>` + answersHTML(n.opts);
    } else {
      cls += ' t-' + n.type;
      h = (isTerminal(n) ? `<span class="stamp">${UI.stamps[n.type]}</span>` : `<span class="kicker">${UI.badge[n.type]}</span>`) +
          `<h2 tabindex="-1">${n.title}</h2><p>${n.text}</p>` + (n.opts ? answersHTML(n.opts) : endHTML(n));
    }
    card.className = cls; card.innerHTML = h;
    if (!reduce){ void card.offsetWidth; card.classList.add('enter'); }
    $('skip-zone').hidden = n.type !== 'q';
    $('quit').hidden = S.cur === 'start' || isTerminal(n);
    if (S.cur === 'start') $('prog').style.width = '0%';
    else if (isTerminal(n)) $('prog').style.width = '100%';
    else $('prog').style.width = (S.qpos / S.seq.length) * 100 + '%';
    $('path').hidden = !S.trail.length;
    $('path-sum').textContent = `${UI.trail} (${S.trail.length})`;
    $('chips').innerHTML = S.trail.map(t => {
      const f = N[t.from];
      return `<span class="chip">${f.type === 'q' ? f.short : f.title} — ${t.label}</span>`;
    }).join('');
    if (focus){ const h2 = card.querySelector('h2'); if (h2) h2.focus({preventScroll:true}); }
  }
  function keepInView(){
    const navH = 0;
    const top = $('hud').getBoundingClientRect().top;
    const cardBottom = $('card').getBoundingClientRect().bottom;
    if (top < navH || cardBottom > window.innerHeight) window.scrollBy({top: top - navH - 8, behavior: reduce ? 'auto' : 'smooth'});
  }
  function effects(d){
    const n = N[S.cur], card = $('card');
    if (reduce) return;
    if (d <= -15 || (isTerminal(n) && n.type === 'stop')){ card.classList.remove('enter'); void card.offsetWidth; card.classList.add('shake'); }
    if (isTerminal(n) && (n.type === 'self' || n.type === 'go') && !n.calm) confetti();
  }

  /* ---------- interactions ---------- */
  function startGame(mode, force){
    reset();
    S.mode = mode;
    S.seq = buildSeq(mode, force);
    S.qpos = force ? Math.max(0, S.seq.indexOf(force)) : 0;
    S.lastQ = S.seq[S.qpos];
    enter(S.lastQ);
    say(UI.startSay[mode], N[S.lastQ].mutter);
    meter(0); setFace('bump'); render(true);
    window.scrollTo({top:0});
  }
  function choose(o){
    const from = S.cur, fn = N[from];
    S.trail.push({from, label:o.label});
    if (fn.type === 'q') S.asked++;
    const d = o.d || 0;
    S.patience = Math.max(0, Math.min(100, S.patience + d));
    if (d < 0) S.lost -= d;
    goTo(o.next);
    const nn = N[S.cur];
    say(o.say || pick(UI.react[d < 0 ? 'neg' : d > 0 ? 'pos' : 'neu']), nn.type === 'q' ? nn.mutter : '');
    meter(d);
    setFace(d < 0 ? 'shake' : 'bump');
    render(true);
    effects(d);
    keepInView();
  }
  $('card').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const act = b.dataset.act;
    if (act === 'start') return startGame(b.dataset.mode);
    if (act === 'again'){ reset(); paint(); window.scrollTo({top:0}); return; }
    if (act === 'copy') return copyResult();
    const o = (N[S.cur].opts || [])[+b.dataset.i];
    if (o) choose(o);
  });
  $('quit').onclick = () => { toast(UI.quitToast); reset(); paint(); window.scrollTo({top:0}); };
  document.addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (!/^[1-9]$/.test(e.key)) return;
    const b = $('card').querySelector(`.ans[data-i="${+e.key - 1}"]`);
    if (b){ e.preventDefault(); b.click(); }
  });

  /* runaway skip button */
  const skip = $('skip');
  function dodge(){
    if (skipN >= UI.skip.length) return;
    skip.textContent = UI.skip[skipN++];
    const zw = $('skip-zone').clientWidth, bw = skip.offsetWidth, room = Math.max(0, zw - bw);
    let x = Math.random() * room, tries = 0;
    while (Math.abs(x - skip.offsetLeft) < Math.min(80, room / 3) && tries++ < 10) x = Math.random() * room;
    skip.style.transform = 'none'; skip.style.left = x + 'px'; skip.style.top = Math.round(Math.random() * 12) + 'px';
    if (skipN >= UI.skip.length){
      setTimeout(() => { skip.textContent = UI.skipDone; skip.classList.add('done'); skip.style.left = '50%'; skip.style.top = '8px'; skip.style.transform = 'translateX(-50%)'; say(UI.skipSay, ''); }, 450);
    }
  }
  skip.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse'){ lastDodge = Date.now(); dodge(); } });
  skip.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse'){ lastDodge = Date.now(); dodge(); } });
  skip.addEventListener('click', () => {
    if (Date.now() - lastDodge < 600) return;
    if (skipN < UI.skip.length) return dodge();
    skip.classList.remove('wiggle'); void skip.offsetWidth; skip.classList.add('wiggle');
  });

  /* copy result */
  function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }
  function copyResult(){
    const txt = UI.share({title:N[S.cur].title, rank:rankOf(S.patience), p:S.patience});
    const fallback = () => {
      const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch(e){}
      ta.remove(); toast(ok ? UI.copied : txt);
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(() => toast(UI.copied), fallback);
    else fallback();
  }
  function confetti(){
    const c = $('confetti'), cols = ['#FFD43B','#E8453C','#4DABF7','#9775FA','#51CF66','#FF8FA3'];
    let h = '';
    for (let i = 0; i < 80; i++){
      const w = 6 + Math.random() * 8;
      h += `<i style="left:${Math.random() * 100}%;width:${w}px;height:${w * 1.4}px;background:${cols[i % cols.length]};animation-duration:${1.8 + Math.random() * 1.6}s;animation-delay:${Math.random() * .5}s"></i>`;
    }
    c.innerHTML = h; clearTimeout(confetti.t); confetti.t = setTimeout(() => { c.innerHTML = ''; }, 4200);
  }

  function paint(){ say(UI.hello, UI.helloThink); meter(0); setFace(); render(false); }
  reset(); paint();
})();
</script>
</body>
